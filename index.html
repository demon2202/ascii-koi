<!doctype html>
<html lang="en" data-theme="pond">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>">
<link rel="preload" href="fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/noto-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="pond.css">
</head>
<body>
<canvas id="pond" aria-hidden="true"></canvas>
<div class="intro">
  <div class="intro-box" id="intro-box">
    <h1 class="sr" id="sr-title"></h1>
    <canvas class="wordmark" id="wordmark" aria-hidden="true"></canvas>
    <canvas class="wordmark-tag" id="wordmark-tag" aria-hidden="true"></canvas>
    <canvas class="wordmark-date" id="intro-date" aria-hidden="true"></canvas>
  </div>
  <nav class="shortcuts" id="shortcuts" aria-label="Quick access"></nav>
</div>
<canvas id="snap" aria-hidden="true"></canvas>
<div class="top-controls">
  <button type="button" class="top-btn" id="dock-toggle" aria-pressed="true" title="Shortcuts: shown" aria-label="Toggle shortcuts dock">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
  </button>
  <button type="button" class="top-btn" id="paw-toggle" aria-pressed="true" title="Cat paw: on" aria-label="Toggle cat paw">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
  </button>
</div>
<div class="ui" id="ui">
  <div class="themes" role="radiogroup" aria-label="Water">
    <button type="button" role="radio" data-theme-pick="pond" title="Pond" aria-label="Pond water">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
    </button>
    <button type="button" role="radio" data-theme-pick="black" title="Black" aria-label="Black water">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button type="button" role="radio" data-theme-pick="light" title="Light" aria-label="Light water">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </button>
  </div>
  <p class="koi-count" id="koi-count" aria-live="polite"></p>
<script src="pond.js"></script>
<script src="app.js"></script>
</body>
</html>
